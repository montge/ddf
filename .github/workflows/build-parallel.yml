name: Build and Test (Parallel)

on:
  push:
    branches:
      - main
      - '*.x'
  pull_request:
    branches:
      - main
      - '*.x'
  workflow_dispatch:

env:
  # -Xss64M: Default thread stack size
  # Distribution build uses 2G stack for Karaf feature resolution (see distribution job)
  # -Xmx8G: Full build requires significant heap space
  MAVEN_OPTS: >-
    -Xmx8G -Xms1G -Xss64M -XX:+UseG1GC -Djava.security.egd=file:/dev/./urandom
  MAVEN_CLI_OPTS: '--batch-mode --errors --fail-at-end --show-version'

jobs:
  #
  # STAGE 1: Build all modules without tests (fastest path to compiled artifacts)
  #
  build:
    name: Build (No Tests)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 22
        uses: actions/setup-java@v5
        with:
          java-version: '22'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build test-jar modules with test compilation
        # These modules export test-jars that other modules depend on.
        # Build them with -DskipTests to compile tests and create test-jars
        # but not run them.
        run: |
          mvn $MAVEN_CLI_OPTS install \
            -DskipTests \
            -DskipITs \
            -Dcheckstyle.skip=true \
            -Dfmt.skip=true \
            -Djacoco.skip=true \
            -pl catalog/core/catalog-core-api,catalog/core/catalog-core-commons,catalog/core/catalog-core-impl/pubsub,catalog/core/catalog-core-api-impl,catalog/spatial/geocoding/spatial-geocoding-api \
            -am

      - name: Build distribution/kernel (provides kernel:zip for feature tests)
        # Build kernel with karaf plugin skipped via profile to avoid StackOverflowError.
        # The plugin has deep recursive feature resolution that exceeds stack limits.
        # The profile binds the problematic execution to phase=none.
        run: |
          mvn $MAVEN_CLI_OPTS install \
            -DskipTests \
            -DskipITs \
            -Dcheckstyle.skip=true \
            -Dfmt.skip=true \
            -Djacoco.skip=true \
            -Pskip-karaf-features \
            -pl distribution/kernel \
            -am

      - name: Build feature modules (needed as test dependencies by other modules)
        # Feature modules generate XML files that other modules need as test deps.
        # Use -am to build dependencies (like libs/test-common) that features need.
        # Use -Pskip-karaf-features because -am pulls in distribution/kernel which
        # has the karaf plugin that causes StackOverflowError.
        # Use -Dmaven.test.skip=true to skip test compilation (not just execution)
        # since we only need the feature XMLs, not test classes.
        run: |
          mvn $MAVEN_CLI_OPTS install \
            -Dmaven.test.skip=true \
            -DskipITs \
            -Dcheckstyle.skip=true \
            -Dfmt.skip=true \
            -Djacoco.skip=true \
            -Pskip-karaf-features \
            -pl features/kernel,features/utilities,features/test-utilities,features/security,features/solr,features/admin,features/apps,features/branding,features/camel-karaf,features/install-profiles \
            -am

      - name: Build all modules (except distribution and test)
        # Build all modules except:
        # - distribution/* (karaf-maven-plugin causes StackOverflowError)
        # - distribution/test/* (depends on distribution/kernel:zip)
        # These modules will be built in the distribution job after tests pass.
        run: |
          EXCLUDED_MODULES=(
            # Distribution modules (karaf-maven-plugin causes StackOverflowError)
            "distribution/kernel"
            "distribution/ddf"
            "distribution/ddf-catalog"
            "distribution/docs"
            "distribution/docker"
            "distribution/docker/ddf-docker"
            "distribution/docker/solr-docker"
            "distribution/docker/solrcloud"
            "distribution/software-list"
            # Test modules (depend on distribution/kernel:zip)
            "distribution/test"
            "distribution/test/features-xml"
            "distribution/test/example-bundle"
            "distribution/test/test-input-transformer-stubs"
            "distribution/test/test-rest-endpoint"
            "distribution/test/test-storageplugins"
            "distribution/test/test-metacard-validator"
            "distribution/test/itests"
            "distribution/test/itests/test-itests-common"
            "distribution/test/itests/test-itests-dependencies-app"
            "distribution/test/itests/test-itests-ddf-core"
            "distribution/test/itests/test-itests-ddf"
            "distribution/test/itests/test-itests-kernel"
            "distribution/test/performance"
            "distribution/test/performance/jmeter"
            "distribution/test/performance/jmeter/catalog-transformer-xml"
            "distribution/test/performance/jmeter/csw"
          )
          EXCLUDE_PL=$(printf "!%s," "${EXCLUDED_MODULES[@]}" | sed 's/,$//')
          mvn $MAVEN_CLI_OPTS install \
            -Dmaven.test.skip=true \
            -DskipITs \
            -Dcheckstyle.skip=true \
            -Dfmt.skip=true \
            -Djacoco.skip=true \
            -pl "$EXCLUDE_PL"

      - name: Upload Maven repository (ddf artifacts only)
        uses: actions/upload-artifact@v7
        with:
          name: maven-repo
          path: |
            ~/.m2/repository/org/codice/ddf/
            ~/.m2/repository/ddf/
          retention-days: 1
          compression-level: 6

  #
  # STAGE 2: Run tests in parallel job groups
  # Test distribution: platform (380), catalog/core (198), catalog/spatial (143),
  # catalog/transformer+rest (86), libs (27), catalog/other (77)
  #
  test-libs:
    name: Test Libs
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 22
        uses: actions/setup-java@v5
        with:
          java-version: '22'
          distribution: 'temurin'
          cache: 'maven'

      - name: Download Maven repository
        uses: actions/download-artifact@v6
        with:
          name: maven-repo
          path: ~/.m2/repository

      - name: Test libs modules
        run: |
          mvn $MAVEN_CLI_OPTS test \
            -pl libs/ \
            -am \
            -Dcheckstyle.skip=true \
            -Dfmt.skip=true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-libs
          path: '**/target/surefire-reports/*.xml'
          retention-days: 7

  test-platform:
    name: Test Platform Modules
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 22
        uses: actions/setup-java@v5
        with:
          java-version: '22'
          distribution: 'temurin'
          cache: 'maven'

      - name: Download Maven repository
        uses: actions/download-artifact@v6
        with:
          name: maven-repo
          path: ~/.m2/repository

      - name: Test platform modules
        run: |
          mvn $MAVEN_CLI_OPTS test \
            -pl platform/ \
            -am \
            -Dcheckstyle.skip=true \
            -Dfmt.skip=true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-platform
          path: '**/target/surefire-reports/*.xml'
          retention-days: 7

  test-catalog-core:
    name: Test Catalog Core Modules
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 22
        uses: actions/setup-java@v5
        with:
          java-version: '22'
          distribution: 'temurin'
          cache: 'maven'

      - name: Download Maven repository
        uses: actions/download-artifact@v6
        with:
          name: maven-repo
          path: ~/.m2/repository

      - name: Test catalog core modules
        run: |
          mvn $MAVEN_CLI_OPTS test \
            -pl catalog/core/ \
            -am \
            -Dcheckstyle.skip=true \
            -Dfmt.skip=true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-catalog-core
          path: '**/target/surefire-reports/*.xml'
          retention-days: 7

  test-catalog-spatial:
    name: Test Catalog Spatial Modules
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 22
        uses: actions/setup-java@v5
        with:
          java-version: '22'
          distribution: 'temurin'
          cache: 'maven'

      - name: Download Maven repository
        uses: actions/download-artifact@v6
        with:
          name: maven-repo
          path: ~/.m2/repository

      - name: Test catalog spatial modules
        run: |
          mvn $MAVEN_CLI_OPTS test \
            -pl catalog/spatial/ \
            -am \
            -Dcheckstyle.skip=true \
            -Dfmt.skip=true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-catalog-spatial
          path: '**/target/surefire-reports/*.xml'
          retention-days: 7

  test-catalog-rest:
    name: Test Catalog REST/Transformer Modules
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 22
        uses: actions/setup-java@v5
        with:
          java-version: '22'
          distribution: 'temurin'
          cache: 'maven'

      - name: Download Maven repository
        uses: actions/download-artifact@v6
        with:
          name: maven-repo
          path: ~/.m2/repository

      - name: Test catalog REST and transformer modules
        run: |
          mvn $MAVEN_CLI_OPTS test \
            -pl catalog/rest/,catalog/transformer/ \
            -am \
            -Dcheckstyle.skip=true \
            -Dfmt.skip=true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-catalog-rest
          path: '**/target/surefire-reports/*.xml'
          retention-days: 7

  test-catalog-other:
    name: Test Catalog Other Modules
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 22
        uses: actions/setup-java@v5
        with:
          java-version: '22'
          distribution: 'temurin'
          cache: 'maven'

      - name: Download Maven repository
        uses: actions/download-artifact@v6
        with:
          name: maven-repo
          path: ~/.m2/repository

      - name: Test catalog plugin, solr, security, opensearch modules
        run: |
          mvn $MAVEN_CLI_OPTS test \
            -pl catalog/plugin/,catalog/solr/,catalog/security/,catalog/opensearch/ \
            -am \
            -Dcheckstyle.skip=true \
            -Dfmt.skip=true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-catalog-other
          path: '**/target/surefire-reports/*.xml'
          retention-days: 7

  #
  # Final status check (distribution build is handled by build-sequential.yml)
  #
  ci-status:
    name: CI Status
    needs: [test-libs, test-platform, test-catalog-core, test-catalog-spatial, test-catalog-rest, test-catalog-other]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs passed
        run: |
          FAILED=false
          for result in \
            "${{ needs.test-libs.result }}" \
            "${{ needs.test-platform.result }}" \
            "${{ needs.test-catalog-core.result }}" \
            "${{ needs.test-catalog-spatial.result }}" \
            "${{ needs.test-catalog-rest.result }}" \
            "${{ needs.test-catalog-other.result }}"; do
            if [[ "$result" != "success" ]]; then
              FAILED=true
            fi
          done
          if [[ "$FAILED" == "true" ]]; then
            echo "One or more test jobs failed"
            exit 1
          fi
          echo "All CI checks passed!"
