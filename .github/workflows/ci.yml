name: CI

on:
  push:
    branches:
      - main
      - '[0-9]+.[0-9]+.x'  # Patch branches like 2.10.x, 2.9.x
  pull_request:
    branches:
      - main
      - '[0-9]+.[0-9]+.x'
  schedule:
    # Nightly build on main (same as Jenkins: H H(17-19) * * *)
    - cron: '0 18 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # -Xss32M: Increase thread stack size to prevent StackOverflowError during Karaf feature resolution
  MAVEN_OPTS: '-Xmx4G -Xms1G -Xss32M -XX:+UseG1GC -Djava.security.egd=file:/dev/./urandom'
  MAVEN_CLI_OPTS: '-B -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn'
  # Exclude distribution and test modules that require Karaf assembly or distribution artifacts
  DISTRO_EXCLUDES: >-
    -pl !distribution/docs,!distribution/ddf,!distribution/ddf-catalog,!distribution/docker,!distribution/docker/ddf-docker,!distribution/docker/solr-docker,!distribution/docker/solrcloud,!distribution/software-list,!distribution/solr-distro,!distribution/kernel,!distribution/test,!distribution/test/features-xml,!distribution/test/example-bundle,!distribution/test/test-input-transformer-stubs,!distribution/test/test-rest-endpoint,!distribution/test/test-storageplugins,!distribution/test/test-metacard-validator,!distribution/test/itests,!distribution/test/itests/test-itests-common,!distribution/test/itests/test-itests-dependencies-app,!distribution/test/itests/test-itests-ddf-core,!distribution/test/itests/test-itests-ddf,!distribution/test/itests/test-itests-kernel,!distribution/test/performance,!distribution/test/performance/jmeter,!distribution/test/performance/jmeter/catalog-transformer-xml,!distribution/test/performance/jmeter/csw

jobs:
  # Incremental build for PRs
  incremental-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          df -h

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed for incremental build

      - name: Set up JDK 22
        uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: 'temurin'
          cache: maven

      - name: Quick install (skip tests)
        run: mvn install $MAVEN_CLI_OPTS -DskipStatic=true -DskipTests=true $DISTRO_EXCLUDES

      - name: Incremental build
        run: |
          mvn clean install $MAVEN_CLI_OPTS \
            -P !itests \
            $DISTRO_EXCLUDES \
            -Dgib.enabled=true \
            -Dgib.referenceBranch=refs/remotes/origin/${{ github.base_ref }}

  # Full build for main/patch branches
  full-build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          df -h

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 22
        uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: 'temurin'
          cache: maven

      - name: Full build (excluding itests)
        run: mvn clean install $MAVEN_CLI_OPTS -P !itests $DISTRO_EXCLUDES

      - name: Run DDF Core integration tests
        run: |
          unset JAVA_TOOL_OPTIONS
          mvn install $MAVEN_CLI_OPTS \
            -pl distribution/test/itests/test-itests-ddf-core \
            -nsu

  # DDF Core integration tests (for PRs)
  integration-tests:
    needs: incremental-build
    if: github.event_name == 'pull_request' && needs.incremental-build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          df -h

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 22
        uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: 'temurin'
          cache: maven

      - name: Quick install (skip tests)
        run: mvn install $MAVEN_CLI_OPTS -DskipStatic=true -DskipTests=true $DISTRO_EXCLUDES

      - name: Run DDF Core integration tests
        run: |
          unset JAVA_TOOL_OPTIONS
          mvn verify $MAVEN_CLI_OPTS \
            -pl distribution/test/itests/test-itests-ddf-core \
            -nsu

  # OWASP Dependency Check
  dependency-check:
    needs: [incremental-build, full-build]
    if: always() && (needs.incremental-build.result == 'success' || needs.full-build.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 22
        uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: 'temurin'
          cache: maven

      - name: OWASP Dependency Check
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            # Full scan with distribution for non-PR builds
            mvn org.commonjava.maven.plugins:directory-maven-plugin:highest-basedir@directories \
              dependency-check:aggregate $MAVEN_CLI_OPTS \
              -q -pl '!distribution/docs' \
              -P '!itests,owasp-dist'
          else
            # Incremental scan for PRs
            mvn org.commonjava.maven.plugins:directory-maven-plugin:highest-basedir@directories \
              dependency-check:aggregate $MAVEN_CLI_OPTS \
              -q -pl '!distribution/docs' \
              -P '!itests'
          fi

      - name: Upload dependency check report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html
          retention-days: 30

  # SonarCloud analysis (main only)
  sonarcloud:
    needs: full-build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for SonarCloud

      - name: Set up JDK 22
        uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: 'temurin'
          cache: maven

      - name: SonarCloud Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn $MAVEN_CLI_OPTS -q \
            -DskipITs \
            -Dcheckstyle.skip=true \
            org.jacoco:jacoco-maven-plugin:prepare-agent \
            sonar:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token=$SONAR_TOKEN \
            -Dsonar.organization=codice \
            -Dsonar.projectKey=ddf \
            -Dsonar.exclusions='**/test/**/*,**/itests/**/*,**/*Test*,**/sdk/**/*,**/*.js,**/node_modules/**/*,**/jaxb/**/*,**/wsdl/**/*,**/nces/sws/**/*,**/*.adoc,**/*.txt,**/*.xml' \
            -pl '!distribution/docs' \
            -P '!itests'
        continue-on-error: true  # Don't fail build if SonarCloud upload fails

  # Deploy artifacts (main and patch branches only, in production)
  deploy:
    needs: [full-build, dependency-check]
    if: |
      always() &&
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || contains(github.ref, '.x')) &&
      needs.full-build.result == 'success' &&
      needs.dependency-check.result == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 22
        uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: 'temurin'
          cache: maven

      - name: Configure Maven settings
        uses: s4u/maven-settings-action@v3.0.0
        with:
          servers: |
            [{
              "id": "releases",
              "username": "${{ secrets.MAVEN_USERNAME }}",
              "password": "${{ secrets.MAVEN_PASSWORD }}"
            },
            {
              "id": "snapshots",
              "username": "${{ secrets.MAVEN_USERNAME }}",
              "password": "${{ secrets.MAVEN_PASSWORD }}"
            }]

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Deploy
        run: |
          mvn deploy $MAVEN_CLI_OPTS \
            -DskipStatic=true \
            -DskipTests=true \
            -DretryFailedDeploymentCount=10

  # Slack notification (non-PR builds only)
  notify-slack:
    needs: [full-build, dependency-check]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Determine build result
        id: result
        run: |
          if [[ "${{ needs.full-build.result }}" == "failure" ]] || \
             [[ "${{ needs.dependency-check.result }}" == "failure" ]]; then
            echo "status=failure" >> $GITHUB_OUTPUT
          else
            echo "status=success" >> $GITHUB_OUTPUT
          fi

      - name: Slack notification
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "${{ steps.result.outputs.status == 'success' && 'SUCCESS' || 'FAILURE' }}: ${{ github.repository }} - ${{ github.ref_name }} #${{ github.run_number }}",
              "attachments": [
                {
                  "color": "${{ steps.result.outputs.status == 'success' && 'good' || 'danger' }}",
                  "fields": [
                    {
                      "title": "Workflow",
                      "value": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>",
                      "short": true
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
        continue-on-error: true  # Don't fail if Slack is not configured
