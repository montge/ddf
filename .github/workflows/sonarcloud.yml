name: SonarCloud Analysis

on:
  push:
    branches:
      - master
      - '*.x'
  pull_request:
    branches:
      - master
      - '*.x'
  schedule:
    # Run nightly for full analysis with coverage
    - cron: '0 4 * * *'
  workflow_dispatch:  # Manual trigger

env:
  # -Xss32M: Increase thread stack size to prevent StackOverflowError during Karaf feature resolution
  MAVEN_OPTS: >-
    -Xmx4G -Xms1G -Xss32M -XX:+UseG1GC -Djava.security.egd=file:/dev/./urandom
  MAVEN_CLI_OPTS: '--batch-mode --errors --fail-at-end --show-version'

jobs:
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Shallow clones should be disabled for a better relevancy of analysis
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # Build and install all modules first (required for multi-module SNAPSHOT deps)
      # Then run sonar analysis
      - name: Build project
        run: |
          mvn $MAVEN_CLI_OPTS install -DskipTests \
            -pl '!distribution/docs' \
            -Dcheckstyle.skip=true \
            -Dfmt.skip=true

      - name: Run SonarCloud analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn $MAVEN_CLI_OPTS sonar:sonar \
            -pl '!distribution/docs' \
            -Dsonar.projectKey=montge_ddf \
            -Dsonar.organization=montge \
            -Dsonar.host.url=https://sonarcloud.io
