name: SonarCloud Analysis

on:
  push:
    branches:
      - main
      - '*.x'
  pull_request:
    branches:
      - main
      - '*.x'
  schedule:
    # Run nightly for full analysis with coverage
    - cron: '0 4 * * *'
  workflow_dispatch:  # Manual trigger

env:
  # -Xss32M: Increase thread stack size to prevent StackOverflowError during Karaf feature resolution
  MAVEN_OPTS: >-
    -Xmx4G -Xms1G -Xss32M -XX:+UseG1GC -Djava.security.egd=file:/dev/./urandom
  MAVEN_CLI_OPTS: '--batch-mode --errors --fail-at-end --show-version'
  # Exclude distribution modules that require Karaf assembly
  DISTRO_EXCLUDES: >-
    -pl !distribution/docs,!distribution/ddf,!distribution/ddf-catalog,!distribution/docker,!distribution/docker/ddf-docker,!distribution/docker/solr-docker,!distribution/docker/solrcloud,!distribution/software-list,!distribution/solr-distro

jobs:
  # Compile-only analysis for push/PR events (fast feedback, no coverage)
  analysis:
    name: SonarCloud Analysis (Compile Only)
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Build project (compile only)
        run: |
          mvn $MAVEN_CLI_OPTS install -DskipTests \
            $DISTRO_EXCLUDES \
            -Dcheckstyle.skip=true \
            -Dfmt.skip=true

      - name: Run SonarCloud analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn $MAVEN_CLI_OPTS sonar:sonar \
            $DISTRO_EXCLUDES

  # Full analysis with tests + JaCoCo coverage for nightly/manual runs
  analysis-with-coverage:
    name: SonarCloud Analysis (With Coverage)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Build and test with JaCoCo coverage
        run: |
          mvn $MAVEN_CLI_OPTS install \
            $DISTRO_EXCLUDES \
            -Dcheckstyle.skip=true \
            -Dfmt.skip=true

      - name: Run SonarCloud analysis with coverage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn $MAVEN_CLI_OPTS sonar:sonar \
            $DISTRO_EXCLUDES
