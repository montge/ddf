name: Playwright E2E Tests

on:
  # Run on push to master (but only if UI files changed)
  push:
    branches: [master]
    paths:
      - 'catalog/ui/**'
      - '.github/workflows/playwright.yml'

  # Run on PRs targeting master (but only if UI files changed)
  pull_request:
    branches: [master]
    paths:
      - 'catalog/ui/**'
      - '.github/workflows/playwright.yml'

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      ddf_url:
        description: 'DDF instance URL for testing'
        required: false
        default: 'https://localhost:8993'

jobs:
  playwright:
    name: Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: catalog/ui/search-ui/simple

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: catalog/ui/search-ui/simple/package.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Run Playwright tests
        run: npm run test:e2e
        env:
          DDF_URL: ${{ github.event.inputs.ddf_url || 'https://localhost:8993' }}
        # Note: Tests will likely fail without a running DDF instance
        # This workflow is a template - adapt based on test environment setup
        continue-on-error: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: catalog/ui/search-ui/simple/playwright-report/
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-test-results
          path: catalog/ui/search-ui/simple/test-results/
          retention-days: 7
