# Pre-commit hooks for DDF (Distributed Data Framework)
# Simplified configuration using reliable hooks only
# See PRE-COMMIT-README.md for installation and usage

default_language_version:
  python: python3

default_stages: [pre-commit]

exclude: |
  (?x)^(
    .*/target/.*|
    .*/node_modules/.*|
    .*\.class|
    .*\.jar|
    .*\.war|
    .*\.zip|
    .*/malformed.*\.xml|
    .*/invalid.*\.json|
    .*/notKml\.kml|
    .*/empty\.geojson|
    .*/SAMLResponse-malformedAssertion\.xml|
    .*/csw-query\.xml|
    .*/csw-function-query\.xml|
    .*/demoCA/private/.*|
    .*localhost-key\.pem|
    .*asdf\.key|
    .*/not_keystore\.jks|
    .*metacard3InvalidXml\.xml|
    platform/solr/solr-factory-impl/src/test/resources/.*|
    catalog/transformer/catalog-transformer-service-atom/src/test/resources/schemas/atom\.rng
  )$

repos:
  # Basic file quality checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-xml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=1024']
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: ['--fix=lf']

  # Java formatting using Maven
  - repo: local
    hooks:
      - id: maven-format
        name: Format Java code
        entry: mvn
        args: ['-q', 'fmt:format', '-DskipTests']
        language: system
        files: \.java$
        pass_filenames: false

      - id: maven-checkstyle
        name: Run Checkstyle
        entry: mvn
        args: ['-q', 'checkstyle:check', '-DskipTests']
        language: system
        files: \.java$
        pass_filenames: false
        stages: [pre-push]

      - id: openspec-validate
        name: Validate OpenSpec specs
        entry: openspec
        args: ['validate', '--specs', '--no-interactive']
        language: system
        files: ^openspec/.*\.md$
        pass_filenames: false

  # Shell script linting
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: ['--severity=warning']
        files: \.(sh|bash)$
