# Pre-commit hooks for DDF (Distributed Data Framework)
# Simplified configuration using reliable hooks only
# See PRE-COMMIT-README.md for installation and usage

default_language_version:
  python: python3

default_stages: [pre-commit]

exclude: |
  (?x)^(
    .*/target/.*|
    .*/node_modules/.*|
    .*\.class|
    .*\.jar|
    .*\.war|
    .*\.zip
  )$

repos:
  # Basic file quality checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-xml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=1024']
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: ['--fix=lf']

  # Java formatting using Maven
  - repo: local
    hooks:
      - id: maven-format
        name: Format Java code
        entry: mvn
        args: ['-q', 'fmt:format', '-DskipTests']
        language: system
        files: \.java$
        pass_filenames: false

      - id: maven-checkstyle
        name: Run Checkstyle
        entry: mvn
        args: ['-q', 'checkstyle:check', '-DskipTests']
        language: system
        files: \.java$
        pass_filenames: false
        stages: [pre-push]
